plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.146' }
group='dev.goetycharms'
version=file('VERSION').text.trim()
base { archivesName='goety-charms' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    main { java.srcDir 'common/src/main/java'; resources.srcDir 'common/src/main/resources' }
    gameTest { java.srcDir 'common/src/gameTest/java'; compileClasspath+=sourceSets.main.output; runtimeClasspath+=sourceSets.main.output }
}
configurations { gameTestImplementation.extendsFrom implementation; gameTestRuntimeOnly.extendsFrom runtimeOnly }
neoForge {
    version='21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        gameTestServer { type='gameTestServer'; gameDirectory=file('run/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','goety_charms'; jvmArgument '-Xmx1100m' }
    }
    mods { goety_charms { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies { implementation fileTree(dir:'libs',include:'*.jar') }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('META-INF/neoforge.mods.toml') { expand(version:project.version) } }
tasks.named('jar') { from('LICENSE'); archiveFileName="goety-charms-${project.version}-mc1.21.1-neoforge.jar" }
tasks.named('sourcesJar') { from('LICENSE') }

ext.releaseArchiveTask = 'jar'
ext.releasePackFormat = 34
ext.blankCharmRecipe = 'data/goety_charms/recipe/blank_charm.json'
apply from: 'gradle/verify-resources.gradle'
